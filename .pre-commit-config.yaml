repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  # Ruff runs as a local hook through uv so the version in pyproject.toml is
  # the single source of truth. A pinned ruff-pre-commit repo would be a
  # second copy of that version that silently drifts.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format-check
        name: ruff format --check
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: no-private-mirror-in-lock
        name: uv.lock must use public PyPI
        entry: scripts/check_lock_public.sh
        language: script
        files: ^uv\.lock$
        pass_filenames: false
